<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Sudoku</title>
	<meta name="description" content="A clean, fast Sudoku game built in TypeScript." />
	<meta name="theme-color" content="#0a0e1f" />
	<link rel="manifest" href="manifest.webmanifest" />
	<link rel="icon" href="icons/favicon.ico" sizes="any" />
	<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />
	<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
	<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
	<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="Sudoku" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="styles.css" />
</head>
<body>
	<main class="app">
		<header class="topbar">
			<div class="brand">
				<h1>Sudoku</h1>
				<p class="tagline">Sharpen your mind</p>
			</div>
			<div class="meta">
				<label class="field">
					<span>Difficulty</span>
					<select class="difficulty"></select>
				</label>
				<div class="field">
					<span>Time</span>
					<div class="timer">00:00</div>
				</div>
			</div>
		</header>

		<div class="board-wrap">
			<div class="board" role="grid" aria-label="Sudoku board"></div>
		</div>

		<p class="status" aria-live="polite"></p>

		<div class="numberpad" aria-label="Number pad"></div>

		<div class="controls">
			<button type="button" class="action new-game">New game</button>
			<button type="button" class="action notes-toggle" aria-pressed="false">Notes</button>
			<button type="button" class="action erase">Erase</button>
			<button type="button" class="action hint">Hint</button>
		</div>

		<footer class="help">
			<span><kbd>1</kbd>–<kbd>9</kbd> place</span>
			<span><kbd>N</kbd> notes</span>
			<span><kbd>⌫</kbd> erase</span>
			<span><kbd>↑↓←→</kbd> move</span>
		</footer>
	</main>

	<script type="module" src="js/main.js"></script>
	<script>
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
				navigator.serviceWorker.register('sw.js').catch((error) => {
					console.error('Service worker registration failed:', error);
				});
			});
		}
	</script>
</body>
</html>
